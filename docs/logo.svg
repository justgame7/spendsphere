<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1040"/>
      <stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#b9f6ff"/>
      <stop offset="0.35" stop-color="#5ee0d0"/>
      <stop offset="0.7" stop-color="#6d5cff"/>
      <stop offset="1" stop-color="#2a1a7a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="120" fill="#6d5cff" opacity="0.55" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="112" fill="url(#orb)"/>
  <!-- spend arcs on the sphere -->
  <path d="M188 292 L226 250 L258 272 L322 204" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="322" cy="204" r="14" fill="#ffffff"/>
  <!-- orbit ring -->
  <ellipse cx="256" cy="256" rx="178" ry="56" transform="rotate(-24 256 256)" fill="none" stroke="url(#ring)" stroke-width="12"/>
  <circle cx="404" cy="190" r="12" fill="#ffd29a"/>
</svg>
